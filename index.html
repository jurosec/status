<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jurosec Status</title>
<meta name="description" content="Service status and incident updates for Jurosec.">
<style>
  :root { --bg:#ffffff; --fg:#1a1a1a; --muted:#5c5c5c; --line:#e3e3e3; --ok:#1d7a3e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#ededed; --muted:#a8a8a8; --line:#2c2c2c; --ok:#5fd38a; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:1.5rem; margin:0 0 24px; }
  .status { border:1px solid var(--line); border-radius:8px; padding:16px; }
  .status strong { color:var(--ok); }
  h2 { font-size:1.1rem; margin:32px 0 8px; }
  p, li { color:var(--muted); }
  a { color:inherit; }
</style>
</head>
<body>
<main>
  <h1>Jurosec Status</h1>
  <div class="status" role="status">
    <strong>Not live yet.</strong> Jurosec is in development. Service status and incident updates will appear on this page.
  </div>
  <h2>Incident history</h2>
  <p>No incidents.</p>
  <p>Questions: <a href="mailto:support@jurosec.com">support@jurosec.com</a></p>
  <p><small>Last updated 2026-10-18.</small></p>
</main>
</body>
</html>
